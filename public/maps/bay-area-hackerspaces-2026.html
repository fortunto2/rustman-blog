<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Area Spaces Map</title>
<meta name="description" content="Map of Bay Area hackerspaces, hacker houses, residencies, founder clubs and Russian-speaking places, checked Oct 2026.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #f8fafc; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
  #map { position: absolute; inset: 0; }
  .legend { background: rgba(255,255,255,.95); padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 1.6; max-width: 210px; font-size: 12px; }
  .legend b { display: block; margin-bottom: 2px; font-size: 13px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  .legend .approx { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 2px dashed #334155; vertical-align: -1px; }
  .legend .toggle { display: none; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; min-width: 180px; }
  .leaflet-popup-content h3 { margin: 0 0 2px; font-size: 14px; }
  .leaflet-popup-content .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .leaflet-popup-content dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  .leaflet-popup-content dt { color: #64748b; }
  .leaflet-popup-content dd { margin: 0; }
  .leaflet-popup-content .note { margin-top: 6px; color: #b45309; font-size: 12px; }
  @media (max-width: 480px) {
    .legend { max-width: 150px; font-size: 11px; padding: 6px 8px; }
    .legend .rows.hidden { display: none; }
    .legend .toggle { display: block; cursor: pointer; font-weight: 600; }
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KINDS = {
  space:   { label: 'Hackerspace / makerspace', color: '#2563eb' },
  house:   { label: 'Hacker house / co-living', color: '#ea580c' },
  program: { label: 'Residency / program',      color: '#16a34a' },
  club:    { label: 'Founder club / venue',     color: '#9333ea' },
  ru:      { label: 'Russian-speaking',         color: '#dc2626' }
};

// approx: true = only the city or neighbourhood is public; the marker sits at its centre.
const PLACES = [
  // Hackerspaces and makerspaces
  { n: 'Hacker Dojo', k: 'space', ll: [37.39584, -121.98274], p: '$150/mo ($180 from 1 Nov 2026), student $75, 24/7', m: 'Monthly membership', u: 'https://hackerdojo.org/pricing/', a: '3200 Patrick Henry Dr, Suite 250, Santa Clara (moved 12 Oct 2026)' },
  { n: 'Noisebridge', k: 'space', ll: [37.76236, -122.41869], p: 'Free, donations ($160/mo suggested)', m: 'Walk in', u: 'https://www.noisebridge.net/wiki/Future_Events', a: '272 Capp St, SF Mission' },
  { n: 'Sudo Room', k: 'space', ll: [37.83500, -122.26415], p: 'Free, open membership', m: 'Walk in (Tuesday open house)', u: 'https://sudoroom.org/', a: 'Omni Commons, 4799 Shattuck Ave, Oakland' },
  { n: 'Ace Makerspace', k: 'space', ll: [37.84470, -122.27689], p: '$200/mo or $2,000/yr, 24/7', m: 'Monthly membership', u: 'https://www.acemakerspace.org/membership/', a: '6050 Lowell St, Oakland' },
  { n: 'Maker Nexus', k: 'space', ll: [37.41207, -122.00590], p: '$160/mo, 10:00-22:00 daily', m: 'Monthly membership', u: 'https://www.makernexus.org/join-maker-nexus', a: '1330 Orleans Dr, Sunnyvale' },
  { n: 'Humanmade', k: 'space', ll: [37.77817, -122.39954], p: '$250/mo ($99 first month), student $200; hardware accelerator free, no equity', m: 'Monthly membership', u: 'https://www.humanmade.org/memberships', a: '655 Bryant St, SF (13,000 sq ft shop)' },
  { n: 'Circuit Launch Oakland', k: 'space', ll: [37.74015, -122.20138], p: 'Hot desk $275/mo, dedicated $325/mo, 24/7 (same price list for both sites)', m: 'Monthly membership', u: 'https://www.circuitlaunch.com/', a: '8000 Edgewater Dr, Oakland (hardware and robotics coworking)' },
  { n: 'Circuit Launch Mountain View', k: 'space', ll: [37.3861, -122.0839], approx: 'Mountain View', p: 'Hot desk $275/mo, dedicated $325/mo, 24/7', m: 'Monthly membership; hosts hardware meetups', u: 'https://www.circuitlaunch.com/' },
  { n: 'Counter Culture Labs', k: 'space', ll: [37.8300, -122.2700], approx: 'Oakland', p: '$100/mo, sliding scale', m: 'Monthly, safety training', u: 'https://www.counterculturelabs.org/join/' },
  { n: 'BioCurious', k: 'space', ll: [37.39540, -121.98180], p: 'Monthly plan + $120 setup (rate unverified)', m: 'Monthly', u: 'https://biocurious.org/membership/', a: '3108 Patrick Henry Dr, Santa Clara' },

  // Founder clubs and event venues
  { n: 'Frontier Tower', k: 'club', ll: [37.78224, -122.40997], p: 'Citizen $190/mo or $1,800/yr, application', m: 'Monthly', u: 'https://frontiertower.io/', a: '995 Market St, SF' },
  { n: 'Founders, Inc. (Night Hack)', k: 'club', ll: [37.80633, -122.43206], p: 'Night Hack free (apply on Luma); campus for funded founders', m: 'Per event', u: 'https://f.inc/', a: 'Fort Mason, SF' },
  { n: 'AGI House (agihouse.org)', k: 'club', ll: [37.55725, -122.36253], approx: 'Hillsborough', p: 'Invite or apply per event', m: 'Events only, no residency', u: 'https://www.agihouse.org/' },
  { n: 'AGI House SF (agihouse.ai)', k: 'club', ll: [37.7700, -122.4250], approx: 'San Francisco', p: 'Per event', m: 'Events; calls itself a residency, separate organisation', u: 'https://agihouse.ai/' },
  { n: 'Mox SF', k: 'club', ll: [37.77080, -122.41999], p: 'Membership by application (price not published); guest program only for partner orgs', m: 'Coworking, ~275 members: AI safety, founders, writers', u: 'https://moxsf.com/', a: '1680 Mission St, SF' },
  { n: 'House of AI', k: 'club', ll: [37.77450, -122.40313], p: 'Desks and events; price not published (ask)', m: 'Curated AI coworking, 6,000 sq ft', u: 'https://www.house-of.ai/', a: '40 Boardman Pl, SF (SoMa)' },
  { n: 'European Startup Embassy', k: 'club', ll: [37.78185, -122.39479], p: 'Day pass booked on LANS (price on that page); Rooftop Demo Night', m: 'Day pass; events open by approval', u: 'https://europeanstartupembassy.com/the-cowork-event-space/', a: '461 Bryant St, South Park, SF' },
  { n: 'Gray Area / Grand Theater', k: 'club', ll: [37.75444, -122.41826], p: 'Events, some free, some paid', m: 'Per event', u: 'https://grayarea.org/', a: '2665 Mission St, SF (open Tue-Fri 12-6 pm)' },
  { n: 'Bay Area AI War Room (Victory Point Cafe)', k: 'club', ll: [37.87517, -122.26844], p: 'Free, Meetup; 1st Saturday monthly 10:00 to 12:00 through 31 Dec 2026', m: 'Walk in', u: 'https://www.meetup.com/bay-area-artificial-war-room/', a: '1797 Shattuck Ave, Berkeley' },
  { n: 'SHACK15', k: 'club', ll: [37.79555, -122.39347], p: 'Members only, dues after application', m: 'Membership', u: 'https://www.shack15.com/membership', a: 'Ferry Building, SF' },
  { n: 'South Park Commons', k: 'club', ll: [37.78064, -122.39404], p: 'Member Residency $0, no equity; Fellowship $400K for 7%', m: 'Member Residency 6 months', u: 'https://blog.southparkcommons.com/what-is-the-spc-member-residency/', a: '380 Brannan St, SF (address from its site)' },

  // Residencies and programs
  { n: 'Frontier Residency', k: 'program', ll: [37.78850, -122.41330], p: 'Housing, desk, lunch included; 3% equity', m: '8 weeks, 10 teams', u: 'https://frontiertower.io/residency', a: 'Housed at Superhero Hotel, 825 Sutter St' },
  { n: 'Draper University + Hero City', k: 'program', ll: [37.56352, -122.32492], p: 'Hero Training paid (tuition unverified); Hero City coworking from ~$100/mo (old list)', m: '5-week cohort, Spring 2027 next', u: 'https://draperuniversity.com/apply?name=HeroTraining&FormNo=firstform', a: '44 E 3rd Ave, San Mateo' },
  { n: 'Lightyear', k: 'program', ll: [37.79272, -122.43564], approx: 'Pacific Heights', p: '$0 (per Aug 2026 directory, verify)', m: '1 month', u: 'https://joinlightyear.com/' },
  { n: 'Z Fellows', k: 'program', ll: [37.7780, -122.4150], approx: 'San Francisco (final day in SF or NYC)', p: 'Optional $10K at a $1B cap, or join with no money', m: '1 week, mostly online, rolling applications', u: 'https://www.zfellows.com/' },
  { n: 'HF0', k: 'program', ll: [37.7740, -122.4300], approx: 'San Francisco', p: 'Batches for repeat founders', m: 'Batch, next start 4 Jan', u: 'https://www.eomag.io/article/hacker-houses-san-francisco' },
  { n: 'Edge Esmeralda', k: 'program', ll: [38.6105, -122.8697], approx: 'Healdsburg (popup)', p: 'Application', m: '4-week popup village; 2026 edition ended 27 Jun', u: 'https://www.edgecity.live/' },

  // Hacker houses and co-livings
  { n: 'Superhero Hotel', k: 'house', ll: [37.78826, -122.41396], p: '$80/night x 30 = $2,400 + ~17.5% tax; Frontier Tower access', m: '30 nights for the monthly rate', u: 'https://www.superherohotel.com', a: '825 Sutter St, SF (hotel)' },
  { n: 'Startup House Palo Alto (AI House)', k: 'house', ll: [37.44054, -122.12518], approx: 'Moreno Ave, Palo Alto', p: 'Shared ~$45/night long stay (~$1,350/mo), private ~$2,000/mo, short stay $65/night', m: '3 nights', u: 'https://startuphouse.co/' },
  { n: 'Startup House Menlo Park (Robo House)', k: 'house', ll: [37.45710, -122.16906], approx: 'Middlefield Rd, Menlo Park', p: 'Ask (no public price)', m: 'Short stays listed', u: 'https://startuphouse.co/' },
  { n: 'Startup House SF', k: 'house', ll: [37.7890, -122.4200], approx: 'Bush St, SF', p: 'Ask (no public price)', m: '7 nights (reported)', u: 'https://startuphouse.co/' },
  { n: 'Accelr8', k: 'house', ll: [37.77631, -122.41815], p: '$1,500-2,500/mo, includes Frontier Tower access', m: '30+ days', u: 'https://joinaccelr8.com/apply', a: '1412 Market St, SF (other houses: Epik on Polk, Alamo Square)' },
  { n: 'Foundry', k: 'house', ll: [37.7800, -122.4280], approx: 'San Francisco, 4 buildings', p: 'From $2,290/mo (small) or $2,690 (large) + 1 month deposit', m: '1 month', u: 'https://foundry.today/faq' },
  { n: 'Mission Control', k: 'house', ll: [37.7660, -122.4220], approx: 'San Francisco', p: '$1,500-1,700/mo, group interview', m: '1 year+', u: 'https://www.eomag.io/article/hacker-houses-san-francisco' },
  { n: '20mish', k: 'house', ll: [37.7720, -122.4400], approx: 'San Francisco', p: '$1,625+/mo', m: '12 months', u: 'https://www.20mish.com/' },
  { n: 'The Residency (SF)', k: 'house', ll: [37.7640, -122.4330], approx: 'San Francisco', p: '$1,800 shared / $3,000 private per month', m: '3-6 months', u: 'https://www.livetheresidency.com/apply' },
  { n: 'The Residency (Berkeley)', k: 'house', ll: [37.87084, -122.27286], approx: 'Berkeley', p: '$1,800 shared / $3,000 private per month', m: '3-6 months', u: 'https://www.livetheresidency.com/apply' },
  { n: 'FoundHer', k: 'house', ll: [37.7860, -122.4330], approx: 'San Francisco', p: '~$1,000+/mo, women only', m: '3 months', u: 'https://www.eomag.io/article/hacker-houses-san-francisco' },
  { n: 'Vibe House SF', k: 'house', ll: [37.74114, -122.46563], approx: 'West Portal', p: 'For exited founders; monthly demos are the open part', m: 'n/a', u: 'https://sfstandard.com/2026/10/04/midlife-hacker-house/' },
  { n: 'Alamo Square House', k: 'house', ll: [37.7770, -122.4330], approx: 'Alamo Square', p: 'Not checked', m: 'Not checked', u: 'https://www.alamosquare.house/' },

  // Russian-speaking
  { n: 'DobryDom (Добрый Дом)', k: 'ru', ll: [37.77636, -122.43470], approx: 'near Alamo Square, private home', p: 'Not published (unverified)', m: 'Not published; closed, applications paused', u: 'https://www.instagram.com/dobrydomsf/' },
  { n: 'GOORT, Ukrainian Tech Hub', k: 'ru', ll: [37.7830, -122.4030], approx: 'San Francisco', p: 'Coworking price not published', m: 'Contact form', u: 'https://www.goort.cc/' },
  { n: 'Silkroad Innovation Hub', k: 'ru', ll: [37.4440, -122.1610], approx: 'Palo Alto / Menlo Park', p: 'Events; Alchemist Silkroad residency', m: 'Residency 3 months', u: 'https://silkroadinnovationhub.com/' },
  { n: 'Tech Flow Bay Area', k: 'ru', ll: [37.7800, -122.4100], approx: 'San Francisco (Aug 2026 meetup at Homeland Loft)', p: 'Free community; 1,000+ members across 14 US cities', m: 'Next Bay Area meetup not announced', u: 'https://www.jointechflow.com/chapters/bay-area' },
  { n: 'Russian Center of SF', k: 'ru', ll: [37.78547, -122.44094], p: 'Cultural events', m: 'Per event', u: 'https://www.russiancentersf.org/local-events', a: '2450 Sutter St, SF' }
];

const map = L.map('map', { scrollWheelZoom: false, tap: true });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const markers = [];
for (const pl of PLACES) {
  const kind = KINDS[pl.k];
  const mk = L.circleMarker(pl.ll, {
    radius: 8, color: pl.approx ? '#334155' : '#ffffff', weight: 2,
    dashArray: pl.approx ? '3 3' : null, fillColor: kind.color, fillOpacity: pl.approx ? 0.7 : 0.95
  }).addTo(map);
  const where = pl.approx ? `${esc(pl.approx)}` : esc(pl.a || '');
  mk.bindPopup(
    `<h3>${esc(pl.n)}</h3>` +
    `<div class="kind" style="color:${kind.color}">${esc(kind.label)}</div>` +
    `<dl><dt>Price</dt><dd>${esc(pl.p)}</dd>` +
    `<dt>Min stay</dt><dd>${esc(pl.m)}</dd>` +
    (where ? `<dt>Where</dt><dd>${where}</dd>` : '') +
    `<dt>Link</dt><dd><a href="${esc(pl.u)}" target="_blank" rel="noopener">${esc(new URL(pl.u).hostname.replace(/^www\./, ''))}</a></dd></dl>` +
    (pl.approx ? `<div class="note">Approximate: marker at the neighbourhood or city centre, exact address not public.</div>` : '')
  );
  mk.bindTooltip(pl.n, { direction: 'top', offset: [0, -6] });
  markers.push(mk);
}
window.MARKER_COUNT = markers.length;

// Fit SF to San Jose; Healdsburg sits outside on purpose.
map.fitBounds([[37.81, -122.52], [37.33, -121.88]], { padding: [10, 10] });

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = function () {
  const d = L.DomUtil.create('div', 'legend');
  const small = window.matchMedia('(max-width: 480px)').matches;
  d.innerHTML = `<span class="toggle">Legend ▾</span><div class="rows${small ? ' hidden' : ''}"><b>${PLACES.length} places, Oct 2026</b>` +
    Object.values(KINDS).map(k => `<div><i style="background:${k.color}"></i>${k.label}</div>`).join('') +
    `<div><span class="approx"></span>Approximate location</div></div>`;
  L.DomEvent.disableClickPropagation(d);
  d.querySelector('.toggle').addEventListener('click', () => d.querySelector('.rows').classList.toggle('hidden'));
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
